# Terraform CI/CD Pipeline — prod
#
# Same pattern as dev, with one critical difference:
# Apply requires manual approval via GitHub Environment protection rules.
#
# Setup: create a "production" environment in repo settings with required reviewers.

name: "Terraform — prod"

on:
  push:
    paths:
      - 'terraform/environments/prod/**'
    branches:
      - main
  pull_request:
    paths:
      - 'terraform/environments/prod/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Prod serialization — never cancel in-progress runs.
concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN_PROD || 'arn:aws:iam::<PROD_ACCOUNT_ID>:role/github-actions-terraform' }}
  TF_ENV: prod

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed Terraform modules
        id: set-matrix
        run: |
          DIRS=$(git diff --name-only HEAD^ HEAD -- terraform/environments/$TF_ENV \
            | xargs -I{} dirname {} \
            | sort -u \
            | grep -v '\.terraform' \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({dir: .})')
          echo "matrix={\"include\":$DIRS}" >> $GITHUB_OUTPUT

  terraform:
    name: "${{ matrix.dir }}"
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Require manual approval for production applies
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        id: fmt
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check

      - name: Terraform init
        id: init
        working-directory: ${{ matrix.dir }}
        run: terraform init

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        id: tflint
        working-directory: ${{ matrix.dir }}
        run: |
          tflint --init
          tflint --no-color

      - name: trivy config scan
        id: trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dir }}
          format: table
          exit-code: '1'  # Fail the build for prod on findings — stricter than dev

      - name: Terraform plan
        id: plan
        working-directory: ${{ matrix.dir }}
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -json tfplan > tfplan.json
        continue-on-error: true

      - name: Setup conftest
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: instrumenta/conftest-action/setup@v0
        with:
          version: 0.56.0

      - name: conftest policy check
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        working-directory: ${{ matrix.dir }}
        run: conftest test tfplan.json --policy ../../../../policies/opa/

      - name: Comment PR with plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### 🔒 PRODUCTION — \`${{ matrix.dir }}\`
            | Step | Status |
            |------|--------|
            | Format | \`${{ steps.fmt.outcome }}\` |
            | Init | \`${{ steps.init.outcome }}\` |
            | Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>Plan output</summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Actor: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform apply
        working-directory: ${{ matrix.dir }}
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
