---
loki:
  enabled: true
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi

promtail:
  enabled: true

  # Ship systemd-journal logs alongside container logs
  extraScrapeConfigs:
    - job_name: journal
      journal:
        path: /var/log/journal
        max_age: 12h
        labels:
          job: systemd-journal
      relabel_configs:
        - source_labels: ["__journal__systemd_unit"]
          target_label: "unit"
        - source_labels: ["__journal__hostname"]
          target_label: "hostname"

  extraVolumes:
    - name: journal
      hostPath:
        path: /var/log/journal

  extraVolumeMounts:
    - name: journal
      mountPath: /var/log/journal
      readOnly: true

# Use Grafana from kube-prometheus-stack — disable the bundled instance
grafana:
  enabled: false

# Loki ships its own log forwarder (Promtail) — disable Fluent Bit
fluent-bit:
  enabled: false
